<!DOCTYPE html>
<html lang ="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quiz Game!</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <div class="screen active" id = "start-screen">
                <h1>Quiz Time!</h1>
                <p>Test how well you know your capitals!</p>
                <button id = "start-btn" class="btn">Start</button>
            </div> 
            <div class = "screen" id = "quiz-screen">
                <div class = "quiz-header">
                    <h2 id = "question-text">Question</h2>
                    <div class = "quiz-info">
                        <p>
                            Question <span id = "current-question">1</span> of <span id = "total-questions">5</span>
                        </p>
                        <p> 
                            Score: <span id = "score">0</span>
                        </p>
                    </div>
                <div id = "answers-container" class = "answers-container"></div>
                   <!-- Answer buttons will be generated here --> answers from js code
                <div class = "progress-bar">
                    <div class = "progress" id = "progress"></div>
            </div>
            <div id = result-screen class = "screen">
                <h2>Quiz Completed!</h2>
                <div> class = "result-info" 
                    <p>Your final score is: <span id = "final-score">0</span> out of <span id = "max-score">5</span></p>
                    <div id = "result-message">Good job!</div>
                </div>

                <button id = "restart-btn" class = "btn">Restart Quiz</button>
        </div>

    </body>
</html>
